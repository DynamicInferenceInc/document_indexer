[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-indexer"
version = "0.1.0"
description = "Importable document indexer: Docling chunking, Qdrant vectors, local or SMB sources"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "qdrant-client>=1.9.0",
]

[project.optional-dependencies]
docling = [
    "docling>=2.0.0",
]
runtime = [
    "watchdog>=4.0.0",
]
smb = [
    "smbprotocol>=1.13.0",
]
dev = [
    "pytest>=8.0.0",
]
all = [
    "document-indexer[docling,runtime,smb]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/document_indexer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "smb_integration: live SMB share test (set DOCUMENT_INDEXER_SMB_TEST=1)",
]
